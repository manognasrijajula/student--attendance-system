<!DOCTYPE html>
<html>

<head>
    <title>Attendance - Student Attendance System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
        }

        h1 {
            color: #123f67;
        }

        input {
            display: block;
            width: 320px;
            padding: 12px;
            margin: 10px auto;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            padding: 12px 25px;
            margin: 15px;
            background-color: #0878b8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #065f91;
        }

        table {
            margin: 25px auto;
            border-collapse: collapse;
            width: 85%;
        }

        th,
        td {
            border: 1px solid #aaa;
            padding: 12px;
        }

        th {
            background-color: #e6f2fa;
        }

        .present {
            color: green;
            font-weight: bold;
        }

        .absent {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Student Attendance System</h1>

    <h2>Mark Attendance</h2>

    <label>Subject:</label>

    <input
        type="text"
        id="subject"
        placeholder="Enter Subject"
    >

    <label>Date:</label>

    <input
        type="date"
        id="attendanceDate"
    >

    <h2>Students</h2>

    <table>

        <thead>
            <tr>
                <th>Student ID</th>
                <th>Student Name</th>
                <th>Roll Number</th>
                <th>Attendance</th>
            </tr>
        </thead>

        <tbody id="studentTable">
        </tbody>

    </table>

    <button onclick="markAllAttendance()">
        Mark All Attendance
    </button>

    <br>

    <button onclick="goDashboard()">
        Back to Dashboard
    </button>


    <script>

        async function loadStudents() {

            try {

                let response =
                    await fetch("https://student-attendance-system-gdaz.onrender.com/students");

                let students = await response.json();

                let table =
                    document.getElementById("studentTable");

                table.innerHTML = "";


                students.forEach(function(student) {

                    let row = table.insertRow();

                    row.insertCell(0).innerHTML =
                        student.student_id;

                    row.insertCell(1).innerHTML =
                        student.student_name;

                    row.insertCell(2).innerHTML =
                        student.roll_number || "-";


                    row.insertCell(3).innerHTML = `

                        <select
                            class="attendanceStatus"
                            data-student-id="${student.student_id}"
                        >

                            <option value="">
                                Select
                            </option>

                            <option value="Present">
                                Present
                            </option>

                            <option value="Absent">
                                Absent
                            </option>

                        </select>

                    `;

                });

            }

            catch (error) {

                console.log(error);

                alert("Unable to load students");

            }

        }


        async function markAllAttendance() {

            let subject =
                document.getElementById("subject").value.trim();

            let attendanceDate =
                document.getElementById("attendanceDate").value;


            if (subject === "" || attendanceDate === "") {

                alert("Please enter Subject and Date");

                return;

            }


            let statusElements =
                document.querySelectorAll(".attendanceStatus");


            let attendanceList = [];


            for (let element of statusElements) {

                let status = element.value;

                let studentId =
                    element.getAttribute("data-student-id");


                if (status === "") {

                    alert(
                        "Please select attendance for all students"
                    );

                    return;

                }


                attendanceList.push({

                    student_id: studentId,
                    status: status

                });

            }


            try {

                let response = await fetch(
                    "http://127.0.0.1:5000/mark_attendance",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            subject: subject,

                            attendance_date: attendanceDate,

                            attendance: attendanceList

                        })

                    }
                );


                let result = await response.json();


                if (response.ok) {

                    alert(result.message);

                    document.getElementById("subject").value = "";

                    document.getElementById(
                        "attendanceDate"
                    ).value = "";

                    statusElements.forEach(function(element) {
                        element.value = "";
                    });

                }

                else {

                    alert("Error: " + result.message);

                }

            }

            catch (error) {

                console.log(error);

                alert("Backend connection failed");

            }

        }


        function goDashboard() {

            window.location.href = "dashboard.html";

        }


        loadStudents();

    </script>

</body>

</html>

<!DOCTYPE html>
<html>
<head>
    <title>Subjects - Student Attendance System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
        }

        h1 {
            color: #123f67;
        }

        input {
            display: block;
            width: 300px;
            padding: 12px;
            margin: 10px auto;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            background-color: #0878b8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #065f91;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 70%;
        }

        th, td {
            border: 1px solid #aaa;
            padding: 12px;
        }

        th {
            background-color: #e6f2fa;
        }
    </style>
</head>

<body>

    <h1>Student Attendance System</h1>

    <h2>Subject Details</h2>

    <label>Subject ID:</label>
    <input type="text" id="subjectId" placeholder="Enter Subject ID">

    <label>Subject Name:</label>
    <input type="text" id="subjectName" placeholder="Enter Subject Name">

    <label>Department:</label>
    <input type="text" id="department" placeholder="Enter Department">

    <label>Semester:</label>
    <input type="text" id="semester" placeholder="Enter Semester">

    <button onclick="addSubject()">Add Subject</button>

    <h2>Subject List</h2>

    <table>
        <thead>
            <tr>
                <th>Subject ID</th>
                <th>Subject Name</th>
                <th>Department</th>
                <th>Semester</th>
            </tr>
        </thead>

        <tbody id="subjectTable">
        </tbody>
    </table>

    <button onclick="goDashboard()">Back to Dashboard</button>

    <script>

        function addSubject() {

            let id = document.getElementById("subjectId").value;
            let name = document.getElementById("subjectName").value;
            let department = document.getElementById("department").value;
            let semester = document.getElementById("semester").value;

            if (id === "" || name === "" || department === "" || semester === "") {
                alert("Please enter all subject details");
                return;
            }

            let table = document.getElementById("subjectTable");

            let row = table.insertRow();

            row.insertCell(0).innerHTML = id;
            row.insertCell(1).innerHTML = name;
            row.insertCell(2).innerHTML = department;
            row.insertCell(3).innerHTML = semester;

            alert("Subject added successfully!");

            document.getElementById("subjectId").value = "";
            document.getElementById("subjectName").value = "";
            document.getElementById("department").value = "";
            document.getElementById("semester").value = "";
        }

        function goDashboard() {
            window.location.href = "dashboard.html";
        }

    </script>

</body>
</html>
